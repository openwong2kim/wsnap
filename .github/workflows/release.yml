name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # v2.0+: the default wsnap.exe is FRAMEWORK-DEPENDENT (~9 MB + loose libSkiaSharp.dll).
      # This drops the self-contained bundle from ~170 MB to ~20 MB total — competitive with
      # Snipaste/PicPick — at the cost of a one-time Microsoft .NET 8 Desktop Runtime install on
      # the user's machine (the installer.iss [Code]/[Run] sections detect and auto-install it
      # via aka.ms; portable-zip users install it themselves). Pass `-SelfContained` to publish.ps1
      # for the legacy all-in-one build locally.
      - name: Publish framework-dependent exe (default)
        run: >
          dotnet publish Wsnap.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o publish

      # Avalonia PREVIEW build (UI migration Phase 6): ships alongside the WPF default as an
      # opt-in portable exe. Distinct name (wsnap-avalonia.exe) on purpose — installable
      # side-by-side, and the shared single-instance mutex keeps only ONE resident at a time
      # so hotkeys never fight. Becomes the default in a future release after preview
      # feedback; no installer / no signing while in preview. Stays self-contained so the
      # preview needs no runtime prerequisite and runs anywhere.
      - name: Publish Avalonia preview exe
        run: >
          dotnet publish Wsnap.Avalonia/Wsnap.Avalonia.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false
          -o publish-avalonia

      # --- Code signing (SignPath) — only runs once SIGNPATH_ORGANIZATION_ID is set ---
      # Sign the exe BEFORE the installer is built, so the installer embeds the signed exe.
      # Until SignPath is configured (vars/secrets empty) every signing step is skipped and
      # the release ships unsigned exactly as before.
      - name: Upload unsigned exe (for signing)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-exe
        uses: actions/upload-artifact@v4
        with:
          name: wsnap-exe-unsigned
          path: publish/wsnap.exe

      - name: Sign exe (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'wsnap' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_EXE || 'exe' }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish   # overwrites publish/wsnap.exe with the signed one

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $ver) { $ver = '1.0.1' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer.iss

      - name: Upload unsigned installer (for signing)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: wsnap-installer-unsigned
          path: dist/wsnap-setup-*.exe

      - name: Sign installer (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'wsnap' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_INSTALLER || 'installer' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist     # overwrites dist/wsnap-setup-*.exe with the signed one

      - name: Package portable zip + checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = 'v1.0.0' }
          # Framework-dependent: ship the exe + its loose native (libSkiaSharp.dll) together.
          # Portable users need the .NET 8 Desktop Runtime installed system-wide (installer.iss
          # handles it for setup users; the release notes link the runtime download).
          Compress-Archive -Path publish\wsnap.exe, publish\libSkiaSharp.dll, LICENSE, NOTICE, THIRD-PARTY-NOTICES.md -DestinationPath "wsnap-$tag-win-x64.zip" -Force
          (Get-FileHash publish\wsnap.exe -Algorithm SHA256).Hash + "  wsnap.exe" | Out-File SHA256SUMS.txt -Encoding ascii
          (Get-FileHash publish\libSkiaSharp.dll -Algorithm SHA256).Hash + "  libSkiaSharp.dll" | Out-File SHA256SUMS.txt -Append -Encoding ascii
          (Get-FileHash publish-avalonia\wsnap-avalonia.exe -Algorithm SHA256).Hash + "  wsnap-avalonia.exe" | Out-File SHA256SUMS.txt -Append -Encoding ascii
          if (Test-Path dist) { Get-ChildItem dist\*.exe | ForEach-Object { ((Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name) | Out-File SHA256SUMS.txt -Append -Encoding ascii } }

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/wsnap.exe
            publish/libSkiaSharp.dll
            publish-avalonia/wsnap-avalonia.exe
            wsnap-*-win-x64.zip
            dist/wsnap-setup-*.exe
            SHA256SUMS.txt
